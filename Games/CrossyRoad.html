<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Перейди дорогу</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #87CEEB;
            /* Небо */
            font-family: 'Fredoka One', cursive;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #a2d149;
            /* Цвет травы по умолчанию */
        }

        canvas {
            display: block;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        #score-board {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 10px;
            color: white;
            font-size: 24px;
            text-shadow: 2px 2px 0 #000;
        }

        .modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #fff;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            border: 4px solid #333;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            pointer-events: auto;
            display: none;
            width: 80%;
            max-width: 320px;
        }

        .modal.active {
            display: block;
        }

        h1 {
            margin: 0 0 15px;
            color: #333;
            font-size: 28px;
        }

        p {
            color: #666;
            font-size: 18px;
            margin-bottom: 20px;
        }

        button.action-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            border-radius: 8px;
            cursor: pointer;
            border-bottom: 4px solid #2E7D32;
            font-family: 'Fredoka One', cursive;
            transition: transform 0.1s;
            width: 100%;
        }

        button.action-btn:active {
            transform: translateY(2px);
            border-bottom: 2px solid #2E7D32;
        }

        /* --- Кнопки управления (D-Pad) --- */
        .d-pad-container {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            height: 180px;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }

        .d-pad {
            position: relative;
            width: 180px;
            height: 180px;
        }

        .d-btn {
            position: absolute;
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.6);
            /* Полупрозрачный белый */
            border-radius: 15px;
            border: 2px solid rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            color: #333;
            pointer-events: auto;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.2);
            transition: transform 0.1s, background 0.1s, box-shadow 0.1s;
            backdrop-filter: blur(2px);
        }

        .d-btn:active,
        .d-btn.pressed {
            background: rgba(255, 255, 255, 0.9);
            transform: translateY(4px);
            box-shadow: 0 0 0 rgba(0, 0, 0, 0.2);
        }

        .btn-up {
            top: 0;
            left: 60px;
        }

        .btn-down {
            bottom: 0;
            left: 60px;
        }

        .btn-left {
            top: 60px;
            left: 0;
        }

        .btn-right {
            top: 60px;
            right: 0;
        }
    </style>
</head>

<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <!-- Визуальные стрелки управления -->
        <div class="d-pad-container">
            <div class="d-pad">
                <div class="d-btn btn-up" data-dir="up">▲</div>
                <div class="d-btn btn-left" data-dir="left">◀</div>
                <div class="d-btn btn-right" data-dir="right">▶</div>
                <div class="d-btn btn-down" data-dir="down">▼</div>
            </div>
        </div>

        <div id="ui-layer">
            <div id="score-board">0</div>

            <div id="start-screen" class="modal active">
                <h1>Crossy Road</h1>
                <p>Перейди дорогу, не попади под машину и не утони!</p>
                <button class="action-btn" onclick="startGame()">ИГРАТЬ</button>
            </div>

            <div id="game-over-screen" class="modal">
                <h1 style="color: #e74c3c;">СБИТ!</h1>
                <p>Счёт: <span id="final-score">0</span></p>
                <button class="action-btn" onclick="startGame()">ЗАНОВО</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score-board');
        const finalScoreEl = document.getElementById('final-score');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const gameOverTitle = gameOverScreen.querySelector('h1');

        // Настройки
        const GRID_SIZE = 40; // Размер клетки
        let COLS = 10;
        let ROWS = 15;

        // Состояние игры
        let animationId;
        let gameActive = false;
        let frameCount = 0;
        let score = 0;
        let maxDistance = 0; // Самая дальняя точка, куда дошел игрок
        let speedMultiplier = 1;

        // Игрок
        const player = {
            gridX: 0, // Логическая позиция X
            gridY: 0, // Логическая позиция Y (прогресс вперед)
            x: 0,     // Визуальная позиция (для анимации)
            y: 0,
            targetX: 0,
            targetY: 0,
            width: GRID_SIZE - 10,
            height: GRID_SIZE - 10,
            color: '#fff', // Курица белая
            isDead: false,
            onLog: false,
            logSpeed: 0
        };

        // Мир (Лейны)
        let lanes = []; // Массив полос препятствий
        const LANE_TYPES = ['grass', 'road', 'river'];

        // Камера
        let cameraY = 0;

        // Инициализация размеров
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            COLS = Math.floor(canvas.width / GRID_SIZE);
            ROWS = Math.floor(canvas.height / GRID_SIZE) + 2; // +2 для буфера
        }
        window.addEventListener('resize', resize);
        resize();

        // --- Обработка ввода (Кнопки и Тач) ---
        function handleInput(direction) {
            if (!gameActive || player.isDead) return;

            let nextX = player.gridX;
            let nextY = player.gridY;

            if (direction === 'up') nextY++;
            if (direction === 'down') nextY--;
            if (direction === 'left') nextX--;
            if (direction === 'right') nextX++;

            // Ограничения
            if (nextX < 0) nextX = 0;
            if (nextX >= COLS) nextX = COLS - 1;
            if (nextY < 0) nextY = 0; // Нельзя идти назад за старт

            // Движение игрока
            player.gridX = nextX;
            player.gridY = nextY;

            // Обновляем счет
            if (player.gridY > maxDistance) {
                maxDistance = player.gridY;
                score = maxDistance;
                scoreEl.innerText = score;
            }

            // Генерация новых лейнов если подходим к краю
            while (lanes.length <= player.gridY + ROWS) {
                lanes.push(new Lane(lanes.length));
            }

            updatePlayerVisuals();
        }

        // Привязка событий к кнопкам на экране
        const buttons = document.querySelectorAll('.d-btn');
        buttons.forEach(btn => {
            const dir = btn.dataset.dir;

            const triggerInput = (e) => {
                // e.preventDefault(); // Предотвращаем стандартное поведение (зум, скролл)
                if (e.cancelable) e.preventDefault();
                handleInput(dir);

                // Визуальный эффект нажатия (класс pressed)
                btn.classList.add('pressed');
                setTimeout(() => btn.classList.remove('pressed'), 100);
            };

            // touchstart работает быстрее click на мобильных
            btn.addEventListener('touchstart', triggerInput, { passive: false });
            btn.addEventListener('mousedown', triggerInput);
        });

        // Клавиатура
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp') handleInput('up');
            if (e.key === 'ArrowDown') handleInput('down');
            if (e.key === 'ArrowLeft') handleInput('left');
            if (e.key === 'ArrowRight') handleInput('right');
        });


        // --- Классы ---

        class Lane {
            constructor(index) {
                this.index = index; // Y индекс в мире (0, 1, 2...)
                this.obstacles = [];
                this.type = this.getType(index);

                // Настройки препятствий
                // Сложность растет каждые 20 шагов
                this.difficulty = Math.min(index / 100, 1) + 1;
                this.direction = Math.random() < 0.5 ? 1 : -1;
                this.speed = (Math.random() * 1.5 + 1.5) * this.difficulty;

                if (this.type === 'road') {
                    this.initCars();
                } else if (this.type === 'river') {
                    this.speed *= 0.8; // Бревна чуть медленнее
                    this.initLogs();
                }
            }

            getType(index) {
                if (index < 3) return 'grass'; // Старт безопасный
                // Простая генерация, чтобы не было непроходимых рек
                // Нельзя делать больше 3 рек подряд
                const prev1 = lanes[index - 1]?.type;
                const prev2 = lanes[index - 2]?.type;
                const prev3 = lanes[index - 3]?.type;

                if (prev1 === 'river' && prev2 === 'river' && prev3 === 'river') return 'grass';

                const rand = Math.random();
                if (rand < 0.4) return 'grass';
                if (rand < 0.7) return 'road';
                return 'river';
            }

            initCars() {
                // Генерируем 1-3 машины
                const count = Math.floor(Math.random() * 2) + 1;
                const spacing = (COLS * GRID_SIZE) / count;

                for (let i = 0; i < count; i++) {
                    this.obstacles.push({
                        x: i * spacing + Math.random() * 50,
                        y: 0, // Относительный Y внутри лейна не важен, рисуем по центру лейна
                        width: GRID_SIZE * 1.2,
                        height: GRID_SIZE * 0.8,
                        color: ['#e74c3c', '#f1c40f', '#9b59b6', '#3498db'][Math.floor(Math.random() * 4)]
                    });
                }
            }

            initLogs() {
                // Генерируем бревна
                const count = Math.floor(Math.random() * 2) + 2; // 2-3 бревна, чтобы можно было пройти
                const spacing = (COLS * GRID_SIZE) / count;

                for (let i = 0; i < count; i++) {
                    this.obstacles.push({
                        x: i * spacing + Math.random() * 50,
                        width: GRID_SIZE * (Math.random() < 0.5 ? 2 : 3), // Длина 2 или 3 клетки
                        height: GRID_SIZE * 0.8,
                        color: '#8d6e63'
                    });
                }
            }

            update() {
                if (this.type === 'grass') return;

                this.obstacles.forEach(obs => {
                    obs.x += this.speed * this.direction;

                    // Зацикливание
                    const totalWidth = COLS * GRID_SIZE;
                    // Чуть шире экрана, чтобы плавно исчезали
                    if (this.direction === 1 && obs.x > canvas.width + GRID_SIZE) {
                        obs.x = -obs.width - Math.random() * 100;
                    } else if (this.direction === -1 && obs.x < -obs.width - GRID_SIZE) {
                        obs.x = canvas.width + Math.random() * 100;
                    }
                });
            }

            draw(ctx, offset) {
                const yPos = canvas.height - ((this.index * GRID_SIZE) - offset) - GRID_SIZE; // Снизу вверх

                // Фон полосы
                if (this.type === 'grass') {
                    ctx.fillStyle = (this.index % 2 === 0) ? '#a2d149' : '#aad751'; // Шахматка травы
                    ctx.fillRect(0, yPos, canvas.width, GRID_SIZE);
                    // Декор (деревья по краям для красоты - опционально, но усложняет чтение кода)
                } else if (this.type === 'road') {
                    ctx.fillStyle = '#555';
                    ctx.fillRect(0, yPos, canvas.width, GRID_SIZE);
                    // Разметка
                    ctx.fillStyle = '#777';
                    ctx.fillRect(0, yPos + GRID_SIZE - 2, canvas.width, 2);
                } else if (this.type === 'river') {
                    ctx.fillStyle = '#4fc3f7';
                    ctx.fillRect(0, yPos, canvas.width, GRID_SIZE);
                }

                // Препятствия
                this.obstacles.forEach(obs => {
                    ctx.fillStyle = obs.color;

                    // Тень для объема
                    ctx.fillStyle = 'rgba(0,0,0,0.2)';
                    ctx.fillRect(obs.x + 4, yPos + (GRID_SIZE - obs.height) / 2 + 4, obs.width, obs.height);

                    ctx.fillStyle = obs.color;
                    ctx.fillRect(obs.x, yPos + (GRID_SIZE - obs.height) / 2, obs.width, obs.height);

                    // Детали для машины
                    if (this.type === 'road') {
                        ctx.fillStyle = 'rgba(255,255,255,0.8)'; // Окна
                        ctx.fillRect(obs.x + 5, yPos + 8, 10, obs.height - 16);
                    }
                });
            }
        }

        // --- Логика Игры ---

        function initGame() {
            resize(); // Убедиться, что сетка правильная
            score = 0;
            maxDistance = 0;
            lanes = [];
            cameraY = 0;

            // Игрок стартует в центре по X, в начале по Y
            player.gridX = Math.floor(COLS / 2);
            player.gridY = 0;
            player.isDead = false;

            // Сбрасываем визуальные координаты
            updatePlayerVisuals(true); // true = мгновенно, без анимации

            // Генерируем начальные лейны
            for (let i = 0; i < ROWS + 5; i++) {
                lanes.push(new Lane(i));
            }

            scoreEl.innerText = '0';
        }

        function updatePlayerVisuals(instant = false) {
            // Вычисляем целевые координаты на экране
            // X = индекс колонки * размер клетки + центровка, если экран шире сетки
            const gridPixelWidth = COLS * GRID_SIZE;
            const offsetX = (canvas.width - gridPixelWidth) / 2;

            player.targetX = offsetX + player.gridX * GRID_SIZE + 5; // +5 padding

            if (instant) {
                player.x = player.targetX;
            }
        }

        // --- Основной цикл ---

        function update() {
            if (!gameActive || player.isDead) return;

            // 1. Обновляем лейны
            lanes.forEach(lane => lane.update());

            // 2. Анимация игрока (Lerp)
            player.x += (player.targetX - player.x) * 0.3;

            // 3. Камера
            // Камера стремится держать игрока на определенной высоте экрана
            // Игровая координата Y=0 это низ экрана. Y увеличивается вверх.
            // Мы хотим, чтобы игрок был на уровне 1/4 снизу (или 3/4 сверху Canvas Y)
            const idealCameraY = (player.gridY * GRID_SIZE) - (GRID_SIZE * 3);
            if (idealCameraY > cameraY) {
                cameraY += (idealCameraY - cameraY) * 0.1; // Плавное слежение
            }

            // 4. Коллизии
            checkCollisions();
        }

        function checkCollisions() {
            // Находим лейн, на котором стоит игрок
            const currentLane = lanes[player.gridY];

            if (!currentLane) return; // Странная ошибка

            // Хитбокс игрока (чуть меньше клетки)
            const pBox = {
                x: player.x + 5,
                width: player.width - 10,
                y: 0 // Y проверяем логически по ID лейна
            };

            player.onLog = false;

            if (currentLane.type === 'road') {
                // Проверка машин
                for (let obs of currentLane.obstacles) {
                    if (rectIntersect(pBox.x, 0, pBox.width, 1, obs.x, 0, obs.width, 1)) {
                        die("Сбит машиной!");
                        return;
                    }
                }
            } else if (currentLane.type === 'river') {
                // Проверка бревен
                let onLog = false;
                for (let obs of currentLane.obstacles) {
                    // Здесь чуть сложнее: если мы пересекаемся с бревном, мы "на нем"
                    if (rectIntersect(pBox.x, 0, pBox.width, 1, obs.x, 0, obs.width, 1)) {
                        onLog = true;
                        // Двигаем игрока вместе с бревном
                        player.x += currentLane.speed * currentLane.direction;
                        player.targetX = player.x; // Сбрасываем таргет, чтобы не дергало обратно

                        // Обновляем логический gridX, чтобы при сходе с бревна встать ровно
                        // Это упрощение: gridX обновляется только при шаге, но визуально мы едем
                        break;
                    }
                }

                if (!onLog) {
                    die("Утонул!");
                } else {
                    // Если уплыл за экран на бревне - тоже смерть
                    if (player.x < -GRID_SIZE || player.x > canvas.width + GRID_SIZE) {
                        die("Уплыл далеко!");
                    }
                }
            }
        }

        function rectIntersect(x1, y1, w1, h1, x2, y2, w2, h2) {
            return x2 < x1 + w1 && x2 + w2 > x1 && y2 < y1 + h1 && y2 + h2 > y1;
        }

        function die(reason) {
            player.isDead = true;
            gameActive = false;
            gameOverTitle.innerText = reason === "Утонул!" ? "БУЛЬ-БУЛЬ!" : "БАБАХ!";
            finalScoreEl.innerText = score;
            gameOverScreen.classList.add('active');
        }

        function draw() {
            // Очистка
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Рисуем видимые лейны
            // Оптимизация: рисуем только те, что попадают в экран + буфер
            const startLaneIndex = Math.floor(cameraY / GRID_SIZE) - 2;
            const endLaneIndex = startLaneIndex + Math.ceil(canvas.height / GRID_SIZE) + 4;

            for (let i = startLaneIndex; i < endLaneIndex; i++) {
                if (i >= 0 && lanes[i]) {
                    lanes[i].draw(ctx, cameraY);
                }
            }

            // Рисуем игрока
            if (!player.isDead || Math.floor(Date.now() / 200) % 2 === 0) { // Мигание если умер
                const playerScreenY = canvas.height - ((player.gridY * GRID_SIZE) - cameraY) - GRID_SIZE;

                ctx.fillStyle = player.color;
                // Тень
                ctx.fillRect(player.x, playerScreenY + 10, player.width, player.height); // Тень падает вниз

                // Тело (белый куб)
                ctx.fillStyle = '#fff';
                ctx.fillRect(player.x, playerScreenY + 5, player.width, player.height); // Подпрыгнул визуально

                // Гребень
                ctx.fillStyle = '#e74c3c';
                ctx.fillRect(player.x + 10, playerScreenY + 5, 10, 5);

                // Глаз
                ctx.fillStyle = '#000';
                ctx.fillRect(player.x + 20, playerScreenY + 10, 4, 4);

                // Клюв
                ctx.fillStyle = '#f1c40f';
                ctx.fillRect(player.x + 24, playerScreenY + 15, 6, 6);
            }
        }

        function gameLoop() {
            update();
            draw();
            animationId = requestAnimationFrame(gameLoop);
        }

        function startGame() {
            // ИСПРАВЛЕНИЕ: Отменяем предыдущий цикл анимации перед запуском нового,
            // чтобы игра не ускорялась (не работала в 2-3 потока) после перезапуска.
            if (animationId) {
                cancelAnimationFrame(animationId);
            }

            startScreen.classList.remove('active');
            gameOverScreen.classList.remove('active');
            gameActive = true;
            initGame();
            gameLoop();
        }

        // Запуск цикла для отрисовки меню на старте
        // Чтобы была картинка на фоне, запускаем один раз draw, но не loop
        draw();
        // Примечание: старый вызов draw() в конце скрипта был корректен для старта, 
        // но теперь startGame контролирует всё.

    </script>
</body>

</html>
