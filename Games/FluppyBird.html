<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Bird HTML5</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #70c5ce;
            /* Классический цвет неба */
            font-family: 'Press Start 2P', cursive;
            touch-action: none;
            /* Запрет зума и скролла */
            user-select: none;
            -webkit-user-select: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI Элементы */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            text-shadow: 2px 2px 0 #000;
        }

        #score-display {
            position: absolute;
            top: 15%;
            /* Чуть ниже верха */
            left: 50%;
            transform: translateX(-50%);
            font-size: 40px;
            color: white;
            z-index: 10;
        }

        #start-screen,
        #game-over-screen {
            background: rgba(0, 0, 0, 0.4);
            padding: 20px;
            border-radius: 10px;
            pointer-events: auto;
            /* Чтобы кнопка работала */
        }

        .hidden {
            display: none !important;
        }

        h1 {
            color: #f4b41b;
            font-size: 24px;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        p {
            color: #fff;
            font-size: 12px;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        button {
            background: #e65100;
            color: white;
            border: 2px solid #fff;
            padding: 15px 20px;
            font-family: 'Press Start 2P', cursive;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 0 #bf360c;
            transition: transform 0.1s;
        }

        button:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #bf360c;
        }

        /* Подсказка для мобильных */
        .tap-hint {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 10px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 0.5;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.5;
            }
        }
    </style>
</head>

<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="score-display">0</div>

        <div id="ui-layer" class="ui-layer">
            <div id="start-screen">
                <h1>Flappy Canvas</h1>
                <p>Тапай, чтобы лететь</p>
                <button onclick="startGame()">СТАРТ</button>
            </div>

            <div id="game-over-screen" class="hidden">
                <h1>Ой!</h1>
                <p>Счет: <span id="final-score">0</span></p>
                <p>Рекорд: <span id="best-score">0</span></p>
                <button onclick="resetGame()">ЗАНОВО</button>
            </div>
        </div>

        <div class="tap-hint">Нажми на экран для прыжка</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // UI элементы
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const scoreDisplay = document.getElementById('score-display');
        const finalScoreEl = document.getElementById('final-score');
        const bestScoreEl = document.getElementById('best-score');

        // Настройки игры
        let frames = 0;
        let score = 0;
        let bestScore = localStorage.getItem('flappy_best') || 0;
        let gameState = 'start'; // start, playing, gameover
        let gameSpeed = 3; // Скорость движения труб

        // Переменные канваса
        let width, height;

        // Изображения (генерируются программно для надежности)
        const birdImg = new Image();
        // Генерируем простую пиксельную птичку через dataURL, чтобы не зависеть от внешних файлов
        // Это желтый квадратик с глазом и клювом
        birdImg.src = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABQAAAAUBAMAAAB/pwA+AAAAElBMVEUAAAD///9HgL+u3///9///7//r510fAAAACHRSTlMAMwA1MzM1AAAej1MzAAAASElEQVR42mNgwA04GfABDgZ8gJMBH+BkwAc4GfABDgZ8gJMBH+BkwAc4GfABDgZ8gIMBH+BgwAc4GPABDgZ8gJMBH+BkwAc4GfABTgabCQB/yR6xAAAAAElFTkSuQmCC";
        // На самом деле, для простоты и красоты нарисуем вектором в canvas

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- ОБЪЕКТ ПТИЦА ---
        const bird = {
            x: 50,
            y: 150,
            w: 30, // ширина
            h: 24, // высота
            radius: 12,
            velocity: 0,
            gravity: 0.25,
            jump: 4.6,
            rotation: 0,

            draw: function () {
                ctx.save();
                ctx.translate(this.x, this.y);

                // Вращение: если падаем - носом вниз, если летим вверх - носом вверх
                // Ограничиваем углы
                this.rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, (this.velocity * 0.1)));

                ctx.rotate(this.rotation);

                // Тело
                ctx.fillStyle = '#f4b41b';
                ctx.fillRect(-this.w / 2, -this.h / 2, this.w, this.h);
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#000';
                ctx.strokeRect(-this.w / 2, -this.h / 2, this.w, this.h);

                // Глаз
                ctx.fillStyle = '#fff';
                ctx.fillRect(2, -8, 10, 10);
                ctx.strokeRect(2, -8, 10, 10);
                ctx.fillStyle = '#000';
                ctx.fillRect(8, -4, 2, 2);

                // Клюв
                ctx.fillStyle = '#e65100';
                ctx.fillRect(6, 2, 12, 6);
                ctx.strokeRect(6, 2, 12, 6);

                // Крыло
                ctx.fillStyle = '#fff';
                ctx.fillRect(-8, 2, 10, 6);
                ctx.strokeRect(-8, 2, 10, 6);

                ctx.restore();
            },

            update: function () {
                // Физика
                this.velocity += this.gravity;
                this.y += this.velocity;

                // Пол (игра не бесконечна вниз)
                if (this.y + this.h / 2 >= height - 20) { // -20 это высота земли
                    this.y = height - 20 - this.h / 2;
                    gameOver();
                }

                // Потолок (не даем улететь в космос)
                if (this.y - this.h / 2 <= 0) {
                    this.y = this.h / 2;
                    this.velocity = 0;
                }
            },

            flap: function () {
                this.velocity = -this.jump;
            }
        };

        // --- ТРУБЫ ---
        const pipes = {
            position: [],
            w: 52,
            h: 0, // вычисляется динамически
            gap: 150, // проем между трубами (можно уменьшить для сложности)
            dx: 3, // скорость труб

            draw: function () {
                for (let i = 0; i < this.position.length; i++) {
                    let p = this.position[i];
                    let topY = p.y;
                    let bottomY = p.y + this.gap;

                    // Цвет трубы
                    ctx.fillStyle = '#73bf2e';
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 2;

                    // Верхняя труба
                    // x, y, w, h
                    ctx.fillRect(p.x, 0, this.w, topY);
                    ctx.strokeRect(p.x, 0, this.w, topY);

                    // Крышка верхней трубы
                    ctx.fillRect(p.x - 2, topY - 20, this.w + 4, 20);
                    ctx.strokeRect(p.x - 2, topY - 20, this.w + 4, 20);

                    // Нижняя труба
                    ctx.fillRect(p.x, bottomY, this.w, height - bottomY - 20); // -20 земля
                    ctx.strokeRect(p.x, bottomY, this.w, height - bottomY - 20);

                    // Крышка нижней трубы
                    ctx.fillRect(p.x - 2, bottomY, this.w + 4, 20);
                    ctx.strokeRect(p.x - 2, bottomY, this.w + 4, 20);
                }
            },

            update: function () {
                // Добавляем новые трубы каждые 120 (или меньше) кадров
                // Чем меньше экран, тем чаще нужны трубы относительно пикселей, но реже по времени
                if (frames % 120 === 0) {
                    // Случайная позиция по Y
                    // Оставляем отступ сверху и снизу
                    let maxPos = height - 20 - this.gap - 50;
                    let minPos = 50;
                    let y = Math.floor(Math.random() * (maxPos - minPos + 1)) + minPos;

                    this.position.push({
                        x: width,
                        y: y,
                        passed: false // Флаг, что мы прошли эту трубу
                    });
                }

                for (let i = 0; i < this.position.length; i++) {
                    let p = this.position[i];
                    p.x -= this.dx;

                    // Коллизии
                    // Проверка по X (мы внутри трубы по горизонтали?)
                    if (bird.x + bird.w / 2 > p.x && bird.x - bird.w / 2 < p.x + this.w) {
                        // Проверка по Y (мы ударились о верх или низ?)
                        // Птица выше начала дырки ИЛИ ниже конца дырки
                        if ((bird.y - bird.h / 2 < p.y) || (bird.y + bird.h / 2 > p.y + this.gap)) {
                            gameOver();
                        }
                    }

                    // Подсчет очков
                    // Если середина трубы прошла середину птицы
                    if (p.x + this.w < bird.x && !p.passed) {
                        score++;
                        scoreDisplay.innerText = score;
                        p.passed = true;
                        // Можно добавить звук point.play()
                    }

                    // Удаление старых труб
                    if (p.x + this.w <= 0) {
                        this.position.shift();
                        // i уменьшаем, так как массив сдвинулся
                        i--;
                    }
                }
            },

            reset: function () {
                this.position = [];
            }
        };

        // --- ФОН И ЗЕМЛЯ ---
        const bg = {
            x: 0,
            draw: function () {
                // Рисуем землю
                ctx.fillStyle = '#ded895';
                ctx.fillRect(0, height - 20, width, 20);

                // Травка сверху земли
                ctx.fillStyle = '#73bf2e';
                ctx.fillRect(0, height - 20, width, 4);
                ctx.strokeStyle = '#000';
                ctx.beginPath();
                ctx.moveTo(0, height - 20);
                ctx.lineTo(width, height - 20);
                ctx.stroke();

                // Движение полосок на земле для эффекта скорости
                this.x = (this.x - pipes.dx) % 20;
                ctx.fillStyle = '#cbb968'; // тени на земле
                for (let i = this.x; i < width; i += 20) {
                    ctx.beginPath();
                    ctx.moveTo(i, height - 20);
                    ctx.lineTo(i - 10, height);
                    ctx.stroke();
                }
            }
        };

        // --- УПРАВЛЕНИЕ ---
        function action() {
            if (gameState === 'start') {
                startGame();
            } else if (gameState === 'playing') {
                bird.flap();
            } else if (gameState === 'gameover') {
                // ничего, ждем клик по кнопке
            }
        }

        // Обработчики событий
        window.addEventListener('keydown', function (e) {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                action();
            }
        });

        // Для мобильных и мыши
        canvas.addEventListener('mousedown', function (e) {
            e.preventDefault();
            action();
        });

        canvas.addEventListener('touchstart', function (e) {
            // e.preventDefault(); // Можно не отменять стандарт, но лучше отменить
            // Для игры лучше preventDefault в CSS (touch-action)
            action();
        }, { passive: false });

        // --- ИГРОВОЙ ЦИКЛ ---
        function loop() {
            // Очистка
            ctx.fillStyle = '#70c5ce';
            ctx.fillRect(0, 0, width, height);

            // Облака (просто декор)
            ctx.fillStyle = '#fff';
            ctx.globalAlpha = 0.5;
            ctx.fillRect(50, height - 150, 60, 30);
            ctx.fillRect(width - 100, 50, 80, 40);
            ctx.globalAlpha = 1.0;

            if (gameState === 'playing') {
                pipes.update();
                pipes.draw();

                bird.update();
                bird.draw();

                bg.draw(); // земля поверх труб

                frames++;
                requestAnimationFrame(loop);
            } else if (gameState === 'start') {
                // Показываем птичку в режиме ожидания (качается)
                bird.y = height / 2 - 50 + Math.sin(Date.now() / 200) * 5;
                bird.draw();
                bg.draw();
                requestAnimationFrame(loop);
            }
            // Если gameover, цикл останавливается или рисует статичный кадр
        }

        function startGame() {
            gameState = 'playing';
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');

            // Сброс параметров
            bird.y = height / 2;
            bird.velocity = 0;
            bird.rotation = 0;
            pipes.reset();
            score = 0;
            frames = 0;
            scoreDisplay.innerText = 0;
        }

        function gameOver() {
            gameState = 'gameover';

            // Обновление рекорда
            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('flappy_best', bestScore);
            }

            finalScoreEl.innerText = score;
            bestScoreEl.innerText = bestScore;

            gameOverScreen.classList.remove('hidden');

            // Рисуем один кадр, чтобы показать момент смерти
            pipes.draw();
            bird.draw();
            bg.draw();
        }

        function resetGame() {
            startGame();
            loop(); // Перезапускаем цикл
        }

        // Запуск начального цикла
        loop();

    </script>
</body>

</html>
