<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Doodle Jump Clone</title>
    <style>
        :root {
            --bg-color: #fcfcfc;
            --grid-color: #f0f0f0;
            --player-color: #8bc34a;
            --platform-color: #795548;
            --text-color: #333;
            --overlay-bg: rgba(255, 255, 255, 0.9);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--overlay-bg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.3s;
        }

        .hidden {
            display: none;
            opacity: 0;
            pointer-events: none;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: var(--player-color);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        h2 {
            font-size: 2rem;
            color: #d32f2f;
            margin-bottom: 20px;
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            color: #666;
            text-align: center;
            line-height: 1.5;
        }

        .btn {
            background: var(--player-color);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.1s;
        }

        .btn:active {
            transform: scale(0.95);
        }

        #score-hud {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #333;
            z-index: 5;
            pointer-events: none;
        }

        .controls-hint {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 40px;
            color: #aaa;
            font-size: 1rem;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <div id="score-hud">Score: 0</div>

    <canvas id="gameCanvas"></canvas>

    <div class="controls-hint">
        <span>&larr; Touch Left</span>
        <span>Touch Right &rarr;</span>
    </div>

    <!-- Start Screen -->
    <div id="start-overlay" class="overlay">
        <h1>Jumper</h1>
        <p>Tap Left or Right to move.<br>Don't fall!</p>
        <button class="btn" onclick="startGame()">Start Game</button>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over-overlay" class="overlay hidden">
        <h2>Game Over</h2>
        <p>Score: <span id="final-score">0</span></p>
        <button class="btn" onclick="startGame()">Play Again</button>
    </div>

    <script>
        // --- Constants & Config ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startOverlay = document.getElementById('start-overlay');
        const gameOverOverlay = document.getElementById('game-over-overlay');
        const scoreHud = document.getElementById('score-hud');
        const finalScoreDisplay = document.getElementById('final-score');

        // Physics constants
        const GRAVITY = 0.4;
        const JUMP_FORCE = -10;
        const MOVE_SPEED = 6;
        const PLATFORM_WIDTH = 70;
        const PLATFORM_HEIGHT = 15;
        const PLAYER_SIZE = 20;

        // Game State
        let gameState = 'START'; // START, PLAYING, GAMEOVER
        let score = 0;
        let highscore = 0;
        let cameraY = 0;

        // Input State
        let input = {
            left: false,
            right: false
        };

        // Entities
        let player = {
            x: 0,
            y: 0,
            radius: PLAYER_SIZE / 2,
            dx: 0,
            dy: 0,
            jumpCount: 0
        };

        let platforms = [];

        // --- Audio System (Web Audio API) ---
        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'jump') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'gameover') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(50, audioCtx.currentTime + 0.5);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            }
        }

        // --- Resize Handling ---
        fun                            canvas.width = window.innerWidth;
                            indow.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- Input Handling ---
        function handleInputStart(e) {
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const halfWidth = window.innerWidth / 2;
            if (clientX < halfWidth) {
                input.left = true;
                input.right = false;
            } else {
                input.right = true;
                input.left = false;
            }
        }

        function handleInputEnd(e) {
             input.left = false;
             input.right                 }
        
        function handleKeyDown(e) {
            f (e.code === 'ArrowLeft') input.left = true;
            if (e.cod            ight') input.right = true;
        }

        function han            
            if (e.code === 'ArrowLeft') input.            
            if (e.code === 'ArrowRight') input.right = false;
                  window.addEvent            chstart', handleInputStart);
  ndow.addEventListener('touchend', handleInputEnd);
        window.addEventListener('mousedown', handleInputStart); 
        window.addEventListener('mouseup', handleInputEnd);
        window.addEventListener('keydown', handleKeyDown);
        window.addEventListener('keyup', handleKeyUp);

        // --- Game Logic ---

        function initGame() {
            player.x = canvas.width / 2;
            player.y = canvas.height - 150;
            player.dx = 0;
            player.dy = JUMP_FORCE; // Start with a jump
           
            score = 0;
            cameraY = 0;

            platforms = [];
            // Initial platform under player
            platforms.push({
                x: canvas.width / 2 - PLATFORM_WIDTH / 2,
                y: canvas.height - 50,
                width: PLATFORM_WIDTH,
                height: PLATFORM_HEIGHT
            });

            // Generate initial batch of platforms
  t y = canvas.height - 150;
            while (y > -1000) {
                y -= (100 + Math.random() * 50); // Gap between 100 and 150
                generatePlatform(y);
            }
        }

        function generatePlatform(y) {
            const x = Math.random() * (canvas.width - PLATFORM_WIDTH);
            platforms.push({ x, y, width: PLATFORM_WIDTH, height: PLATFORM_HEIGHT });
        }

        function update() {
            if (gameState !== 'PLAYING') return;

            // Horizontal Movement
            if (input.left) player.dx = -MOVE_SPEED;
            else if (input.right) player.dx = MOVE_SPEED;
            else player.dx = 0;

            player.x += player.dx;

            // Screen Wrap
            if (player.x + player.radius < 0) player.x = canvas.width + player.radius;
            if (player.x - player.radius > canvas.width) player.x = -player.radius;

            // Vertical Physics
            player.dy += GRAVITY;
            player.y += player.dy;

            // Camera Follow (only when going up above mid-screen)
            if (player.y < canvas.height / 2 && player.dy < 0) {
                const shift = -player.dy;
                player.y += shift; 
                cameraY += shift;
                score = Math.floor(cameraY / 10); 

                platforms.forEach(p => p.y += shift);
                
                const highestPlatform = platforms[platforms.length - 1];
                if (highestPlatform.y > 50) { 
                     generatePlatform(highestPlatform.y - (100 + Math.random() * 60));
                }

                platforms = platforms.filter(p => p.y < canvas.height);
            }

            // Platform Collision
            if (player.dy > 0) {
                platforms.forEach(p => {
                    if (
                        player.x + player.radius > p.x &&
                        player.x - player.radius < p.x + p.width &&
        player.y + player.radius > p.y &&
                        player.y + player.radius < p.y + p.height + player.dy 
                    ) {
                        player.dy = JUMP_FORCE;
                                 'jump');
                    }
                });
            }

            // Game Over Condition
            if (player.y - player.radius > canvas.height) {
                endGame();
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Background Grid (Subtle)
            ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--grid-color');
            ctx.beginPath();
            for (let x=0; x<canvas.width; x+=40) { ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); }
            for (let y=0; y<canvas.height; y+=40) { ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); }
            ctx.stroke();

            // Draw Platforms
            ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--platform-color');
            platforms.forEach(p => {
                ctx.fillRect(p.x, p.y, p.width, p.height);
            });

            // Draw Player
            ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--player-color');
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fill();
            
            // Draw Eyes
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(player.x - 5, player.y - 2, 4, 0, Math.PI * 2);
            ctx.arc(player.x + 5, player.y - 2, 4, 0, Math. P I *  2 );
             ct x.fill();
             ctx.fillStyle  = 'black';
            ctx.beginPath();
                ctx.arc(pl ay er.x - 3 + (player. dx * 0.2), player.y - 2, 1.5 , 0, Math.PI * 2);
            ctx.arc(player.x + 7 + (player.dx * 0.2), player.y - 2, 1.5, 0, Math.PI * 2);
            ctx.fill();

            scoreHud.textContent = `Score: ${score}`;
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        function startGame() {
            initAudio();
            startOverlay.classList.add('hidden');
            gameOverOverlay.classList.add('hidden');
            gameState = 'PLAYING';
            initGame();
       function endGame() {
            gameState = 'GAMEOVER';
            playSound('gameover');
            finalScoreDisplay.textContent = score;
            gameOverOverlay.classList.remove('hidden');
        }

        loop();

    </script>
</body>

</html>
