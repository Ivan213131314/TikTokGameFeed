<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Прыжок в высоту</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap');

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #fcf8e8;
            /* Цвет бумаги */
            font-family: 'Comic Neue', cursive;
            touch-action: none;
            /* Отключает зум и скролл браузера */
            user-select: none;
            -webkit-user-select: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }

        /* UI Elements */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            /* Чтобы клики проходили сквозь UI к кнопкам, если нужно */
        }

        #score {
            position: absolute;
            top: 10px;
            left: 20px;
            font-size: 24px;
            color: #333;
            font-weight: bold;
        }

        /* Экран меню и проигрыша */
        .modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            /* Чуть менее прозрачный */
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            border: 3px solid #333;
            box-shadow: 5px 5px 0px rgba(0, 0, 0, 0.2);
            pointer-events: auto;
            display: none;
            z-index: 10;
            width: 85%;
            /* Адаптивная ширина */
            max-width: 350px;
            /* Ограничение для планшетов */
            box-sizing: border-box;
            /* Учитываем padding в ширине */
        }

        .modal.active {
            display: block;
        }

        h1 {
            margin: 0 0 10px 0;
            color: #5cb85c;
            font-size: 32px;
        }

        p {
            font-size: 18px;
            color: #555;
        }

        button.start-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            font-family: 'Comic Neue', cursive;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 15px;
            border-bottom: 4px solid #c92a2a;
            transition: transform 0.1s;
        }

        button.start-btn:active {
            transform: translateY(2px);
            border-bottom: 2px solid #c92a2a;
        }

        /* Мобильное управление */
        .controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            height: 80px;
            display: flex;
            justify-content: space-between;
            padding: 0 15px;
            /* Чуть меньше отступы */
            box-sizing: border-box;
            pointer-events: auto;
        }

        .control-btn {
            width: 70px;
            /* Чуть компактнее */
            height: 70px;
            background: rgba(255, 255, 255, 0.3);
            /* Светлее для лучшей видимости */
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 36px;
            color: rgba(0, 0, 0, 0.6);
            user-select: none;
            cursor: pointer;
            border: 2px solid rgba(0, 0, 0, 0.1);
            transition: background 0.1s;
            backdrop-filter: blur(2px);
            /* Размытие фона под кнопкой */
        }

        .control-btn:active,
        .control-btn.pressed {
            background: rgba(255, 255, 255, 0.5);
            transform: scale(0.95);
        }

        /* Инструкция для десктопа */
        #desktop-hint {
            position: absolute;
            bottom: 10px;
            width: 100%;
            text-align: center;
            color: #999;
            font-size: 12px;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="ui-layer">
            <div id="score">Счёт: 0</div>

            <!-- Меню старта -->
            <div id="start-screen" class="modal active">
                <h1>Doodle Jump</h1>
                <p>Прыгай как можно выше!</p>
                <p>Управление стрелками</p>
                <button class="start-btn" onclick="startGame()">ИГРАТЬ</button>
            </div>

            <!-- Экран проигрыша -->
            <div id="game-over-screen" class="modal">
                <h1 style="color: #ff6b6b;">Ой! Упал!</h1>
                <p>Твой счёт: <span id="final-score">0</span></p>
                <button class="start-btn" onclick="startGame()">ЕЩЁ РАЗ</button>
            </div>

            <!-- Кнопки управления (видны всегда, но полезны на мобилках) -->
            <div class="controls">
                <div id="btn-left" class="control-btn">←</div>
                <div id="btn-right" class="control-btn">→</div>
            </div>

            <div id="desktop-hint">Используйте стрелки клавиатуры или кнопки на экране</div>
        </div>
    </div>

    <script>
        // --- Константы и настройки ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const finalScoreEl = document.getElementById('final-score');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');

        let animationId;
        let score = 0;
        let gameActive = false;

        // Физика
        const GRAVITY = 0.4; // Гравитация
        const JUMP_FORCE = -12.5; // Сила прыжка (вверх) - Увеличена для более высоких прыжков
        const PLAYER_SPEED = 6; // Скорость движения влево/вправо

        // Переменные экрана
        let width, height;

        // Состояние игрока
        const player = {
            x: 0,
            y: 0,
            width: 40,
            height: 40,
            vx: 0,
            vy: 0,
            color: '#8bc34a', // Зеленый дудлер
            direction: 1 // 1 вправо, -1 влево (для глаз)
        };

        // Платформы
        let platforms = [];
        const PLATFORM_HEIGHT = 15;
        const BASE_PLATFORM_WIDTH = 70;

        // Сложность
        let cameraY = 0; // Смещение камеры
        let maxJumpHeight; // Рассчитывается динамически

        // Управление
        const keys = {
            left: false,
            right: false
        };

        // --- Инициализация и Resize ---
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;

            // Пересчет физики прыжка для гарантии проходимости
            // h = v^2 / (2g). 
            // При силе -10 и гравитации 0.4: 100 / 0.8 = 125 пикселей высота прыжка.
            // Оставим запас.
            maxJumpHeight = (Math.abs(JUMP_FORCE) * Math.abs(JUMP_FORCE)) / (2 * GRAVITY);
        }

        window.addEventListener('resize', resize);
        resize();

        // --- Управление ---

        // Клавиатура
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') keys.left = true;
            if (e.key === 'ArrowRight') keys.right = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft') keys.left = false;
            if (e.key === 'ArrowRight') keys.right = false;
        });

        // Тач/Кнопки
        const btnLeft = document.getElementById('btn-left');
        const btnRight = document.getElementById('btn-right');

        const handleInputStart = (direction) => {
            if (direction === 'left') {
                keys.left = true;
                btnLeft.classList.add('pressed');
            } else {
                keys.right = true;
                btnRight.classList.add('pressed');
            }
        };

        const handleInputEnd = (direction) => {
            if (direction === 'left') {
                keys.left = false;
                btnLeft.classList.remove('pressed');
            } else {
                keys.right = false;
                btnRight.classList.remove('pressed');
            }
        };

        // События для мыши и тача
        btnLeft.addEventListener('mousedown', () => handleInputStart('left'));
        btnLeft.addEventListener('mouseup', () => handleInputEnd('left'));
        btnLeft.addEventListener('mouseleave', () => handleInputEnd('left'));
        btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); handleInputStart('left'); });
        btnLeft.addEventListener('touchend', (e) => { e.preventDefault(); handleInputEnd('left'); });

        btnRight.addEventListener('mousedown', () => handleInputStart('right'));
        btnRight.addEventListener('mouseup', () => handleInputEnd('right'));
        btnRight.addEventListener('mouseleave', () => handleInputEnd('right'));
        btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); handleInputStart('right'); });
        btnRight.addEventListener('touchend', (e) => { e.preventDefault(); handleInputEnd('right'); });


        // --- Логика игры ---

        function generatePlatform(minY) {
            // Логика сложности
            // Чем больше очков (высота), тем сложнее
            const difficultyMultiplier = Math.min(score / 5000, 1); // 0 -> 1

            // Ширина платформы уменьшается с высотой (мин 40px)
            const currentWidth = Math.max(40, BASE_PLATFORM_WIDTH - (difficultyMultiplier * 20));

            // Вероятность движущейся платформы растет (макс 30%)
            const isMoving = Math.random() < (difficultyMultiplier * 0.4);

            // Безопасный отступ от краев экрана (10px) для узких экранов с закруглениями
            const safeMargin = 10;
            const maxX = width - currentWidth - safeMargin;
            const minX = safeMargin;

            const platform = {
                width: currentWidth,
                height: PLATFORM_HEIGHT,
                x: minX + Math.random() * (maxX - minX), // Генерация с отступами
                y: minY,
                type: isMoving ? 'moving' : 'static',
                speed: isMoving ? (2 + Math.random() * 2) * (Math.random() < 0.5 ? 1 : -1) : 0,
                color: isMoving ? '#4fc3f7' : '#8bc34a' // Синяя или Зеленая
            };
            platforms.push(platform);
        }

        function initGame() {
            player.x = width / 2 - player.width / 2;
            player.y = height - 150;
            player.vx = 0;
            player.vy = JUMP_FORCE;
            score = 0;
            cameraY = 0;

            platforms = [];

            // Стартовая платформа под ногами
            platforms.push({
                x: width / 2 - BASE_PLATFORM_WIDTH / 2,
                y: height - 50,
                width: BASE_PLATFORM_WIDTH,
                height: PLATFORM_HEIGHT,
                type: 'static',
                color: '#8bc34a'
            });

            // Генерируем начальные платформы до верха экрана
            let currentY = height - 50;
            while (currentY > 0) {
                // Расстояние между платформами: от 30px до (МаксПрыжок - 20px) для гарантии
                currentY -= (40 + Math.random() * (maxJumpHeight - 60));
                generatePlatform(currentY);
            }
        }

        function update() {
            if (!gameActive) return;

            // Движение игрока
            if (keys.left) {
                player.vx = -PLAYER_SPEED;
                player.direction = -1;
            } else if (keys.right) {
                player.vx = PLAYER_SPEED;
                player.direction = 1;
            } else {
                player.vx = 0;
            }

            player.x += player.vx;
            player.vy += GRAVITY;
            player.y += player.vy;

            // Проход сквозь стены (Screen Wrap)
            if (player.x + player.width < 0) {
                player.x = width;
            } else if (player.x > width) {
                player.x = -player.width;
            }

            // Движение платформ
            platforms.forEach(p => {
                if (p.type === 'moving') {
                    p.x += p.speed;
                    // Отскок от стен
                    if (p.x <= 0 || p.x + p.width >= width) {
                        p.speed *= -1;
                    }
                }
            });

            // Камера (Скроллинг мира вниз, когда игрок прыгает высоко)
            // Если игрок выше середины экрана
            if (player.y < height / 2) {
                const diff = (height / 2) - player.y;
                player.y = height / 2; // Фиксируем игрока

                // Сдвигаем платформы вниз
                platforms.forEach(p => {
                    p.y += diff;
                });

                // Счет равен пройденной дистанции
                score += Math.floor(diff);
                scoreEl.innerText = `Счёт: ${score}`;

                // Удаляем старые платформы внизу
                platforms = platforms.filter(p => p.y < height + 50);

                // Генерируем новые сверху
                const highestPlatform = platforms[platforms.length - 1]; // Самая верхняя (меньший Y)
                // Ищем самую верхнюю платформу (минимальный y)
                let minP = platforms[0];
                platforms.forEach(p => { if (p.y < minP.y) minP = p; });

                if (minP.y > 50) { // Если верхняя платформа уехала слишком низко, создаем новую
                    // Гарантируем, что следующая платформа достижима
                    const nextY = minP.y - (40 + Math.random() * (maxJumpHeight - 60));
                    generatePlatform(nextY);
                }
            }

            // Коллизии (только если падаем вниз)
            if (player.vy > 0) {
                platforms.forEach(p => {
                    if (
                        player.x + player.width * 0.7 > p.x && // Сужаем хитбокс игрока для "честности"
                        player.x + player.width * 0.3 < p.x + p.width &&
                        player.y + player.height > p.y &&
                        player.y + player.height < p.y + p.height + player.vy // +vy чтобы не пролетать сквозь на большой скорости
                    ) {
                        // Прыжок!
                        player.vy = JUMP_FORCE;
                        // Звуковой эффект можно добавить здесь
                    }
                });
            }

            // Game Over (упал ниже экрана)
            if (player.y > height) {
                gameOver();
            }
        }

        function draw() {
            // Очистка
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Сетка (эффект тетрадного листа)
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.lineWidth = 1;
            const gridSize = 30;

            // Смещаем сетку вместе с камерой для параллакс-эффекта или статики
            // Сделаем статику для простоты, или легкий сдвиг
            for (let x = 0; x < width; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
            }
            for (let y = 0; y < height; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
            }

            // Рисуем платформы
            platforms.forEach(p => {
                ctx.fillStyle = p.color;

                // Скругленные края платформы
                roundRect(ctx, p.x, p.y, p.width, p.height, 5, true);

                // Тени платформ
                ctx.fillStyle = 'rgba(0,0,0,0.1)';
                roundRect(ctx, p.x + 3, p.y + 3, p.width, p.height, 5, true);
            });

            // Рисуем Игрока (Дудлер)
            ctx.save();
            ctx.translate(player.x + player.width / 2, player.y + player.height / 2);

            // Тело
            ctx.fillStyle = player.color;
            // Отражение по горизонтали если идем влево
            if (player.direction === -1) ctx.scale(-1, 1);

            ctx.fillRect(-15, -15, 30, 30);
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.strokeRect(-15, -15, 30, 30);

            // Ноги (простая анимация)
            if (player.vy < 0) {
                // Прыжок - ноги поджаты
                ctx.fillRect(-15, 15, 10, 5);
                ctx.fillRect(5, 15, 10, 5);
            } else {
                // Падение - ноги вниз
                ctx.fillRect(-15, 15, 10, 10);
                ctx.fillRect(5, 15, 10, 10);
            }

            // Глаза
            ctx.fillStyle = 'white';
            ctx.fillRect(5, -10, 8, 8);
            ctx.fillStyle = 'black';
            ctx.fillRect(9, -8, 3, 3);

            // Рот (просто нос/рот дудлера)
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(15, 0);
            ctx.lineTo(22, 0);
            ctx.stroke();

            ctx.restore();
        }

        // Вспомогательная функция для рисования скругленных прямоугольников
        function roundRect(ctx, x, y, width, height, radius, fill) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
            if (fill) ctx.fill();
        }

        function gameLoop() {
            update();
            draw();
            if (gameActive) {
                animationId = requestAnimationFrame(gameLoop);
            }
        }

        function startGame() {
            startScreen.classList.remove('active');
            gameOverScreen.classList.remove('active');
            gameActive = true;
            initGame();
            gameLoop();
        }

        function gameOver() {
            gameActive = false;
            cancelAnimationFrame(animationId);
            finalScoreEl.innerText = score;
            gameOverScreen.classList.add('active');
        }

    </script>
</body>

</html>
