<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Doodle Jump Clone</title>
    <style>
        :root {
            --bg-color: #fcfcfc;
            --grid-color: #f0f0f0;
            --player-color: #8bc34a;
            --platform-color: #795548;
            --text-color: #333;
            --overlay-bg: rgba(255, 255, 255, 0.9);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--overlay-bg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.3s;
        }

        .hidden {
            display: none !important;
            opacity: 0;
            pointer-events: none;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: var(--player-color);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        h2 {
            font-size: 2rem;
            color: #d32f2f;
            margin-bottom: 20px;
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            color: #666;
            text-align: center;
            line-height: 1.5;
        }

        .btn {
            background: var(--player-color);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.1s;
        }

        .btn:active {
            transform: scale(0.95);
        }

        #score-hud {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #333;
            z-index: 5;
            pointer-events: none;
        }

        .controls-hint {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 40px;
            color: #aaa;
            font-size: 1rem;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <div id="score-hud">Score: 0</div>
    <canvas id="gameCanvas"></canvas>

    <div class="controls-hint">
        <span>&larr; Touch Left</span>
        <span>Touch Right &rarr;</span>
    </div>

    <!-- Start Screen -->
    <div id="start-overlay" class="overlay">
        <h1>Jumper</h1>
        <p>Tap Left or Right to move.<br>Don't fall!</p>
        <button class="btn" onclick="startGame()">Start Game</button>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over-overlay" class="overlay hidden">
        <h2>Game Over</h2>
        <p>Score: <span id="final-score">0</span></p>
        <button class="btn" onclick="startGame()">Play Again</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startOverlay = document.getElementById('start-overlay');
        const gameOverOverlay = document.getElementById('game-over-overlay');
        const scoreHud = document.getElementById('score-hud');
        const finalScoreDisplay = document.getElementById('final-score');

        const GRAVITY = 0.4;
        const JUMP_FORCE = -10;
        const MOVE_SPEED = 6;
        const PLATFORM_WIDTH = 70;
        const PLATFORM_HEIGHT = 15;
        const PLAYER_SIZE = 20;

        let gameState = 'START';
        let score = 0;
        let cameraY = 0;
        let platforms = [];
        let input = { left: false, right: false };

        let player = {
            x: 0,
            y: 0,
            radius: PLAYER_SIZE / 2,
            dx: 0,
            dy: 0
        };

        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'jump') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'gameover') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(50, audioCtx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            }
        }

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Multi-touch Input Handling
        const activeTouches = new Map();

        function updateInputState() {
            let left = false;
            let right = false;
            const halfWidth = window.innerWidth / 2;

            activeTouches.forEach((touchX) => {
                if (touchX < halfWidth) left = true;
                else right = true;
            });

            input.left = left;
            input.right = right;
        }

        window.addEventListener('touchstart', (e) => {
            Array.from(e.changedTouches).forEach(t => activeTouches.set(t.identifier, t.clientX));
            updateInputState();
        });
        window.addEventListener('touchmove', (e) => {
            Array.from(e.changedTouches).forEach(t => activeTouches.set(t.identifier, t.clientX));
            updateInputState();
        });
        window.addEventListener('touchend', (e) => {
            Array.from(e.changedTouches).forEach(t => activeTouches.delete(t.identifier));
            updateInputState();
        });
        window.addEventListener('touchcancel', (e) => {
            Array.from(e.changedTouches).forEach(t => activeTouches.delete(t.identifier));
            updateInputState();
        });

        window.addEventListener('mousedown', (e) => {
            activeTouches.set('mouse', e.clientX);
            updateInputState();
        });
        window.addEventListener('mouseup', () => {
            activeTouches.delete('mouse');
            updateInputState();
        });

        window.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowLeft') input.left = true;
            if (e.code === 'ArrowRight') input.right = true;
        });
        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowLeft') input.left = false;
            if (e.code === 'ArrowRight') input.right = false;
        });

        function generatePlatform(y) {
            const x = Math.random() * (canvas.width - PLATFORM_WIDTH);
            platforms.push({ x, y, width: PLATFORM_WIDTH, height: PLATFORM_HEIGHT });
        }

        function initGame() {
            player.x = canvas.width / 2;
            player.y = canvas.height - 150;
            player.dx = 0;
            player.dy = JUMP_FORCE;
            score = 0;
            cameraY = 0;
            platforms = [];
            platforms.push({
                x: canvas.width / 2 - PLATFORM_WIDTH / 2,
                y: canvas.height - 50,
                width: PLATFORM_WIDTH,
                height: PLATFORM_HEIGHT
            });

            let y = canvas.height - 150;
            while (y > -1000) {
                y -= 120; // Initial gap
                generatePlatform(y);
            }
        }

        function update() {
            if (gameState !== 'PLAYING') return;

            if (input.left) player.dx = -MOVE_SPEED;
            else if (input.right) player.dx = MOVE_SPEED;
            else player.dx = 0;

            player.x += player.dx;
            if (player.x + player.radius < 0) player.x = canvas.width + player.radius;
            if (player.x - player.radius > canvas.width) player.x = -player.radius;

            player.dy += GRAVITY;
            player.y += player.dy;

            if (player.y < canvas.height / 2 && player.dy < 0) {
                const shift = -player.dy;
                player.y += shift;
                cameraY += shift;
                score = Math.floor(cameraY / 10);

                platforms.forEach(p => p.y += shift);

                const highest = platforms[platforms.length - 1];
                if (highest.y > 50) {
                    // Difficulty factor: increase gap as score increases
                    const difficulty = Math.min(100, score / 50);
                    const minGap = 100 + difficulty;
                    const maxGap = 160 + difficulty;
                    generatePlatform(highest.y - (minGap + Math.random() * (maxGap - minGap)));
                }
                platforms = platforms.filter(p => p.y < canvas.height);
            }

            if (player.dy > 0) {
                platforms.forEach(p => {
                    if (player.x + player.radius > p.x &&
                        player.x - player.radius < p.x + p.width &&
                        player.y + player.radius > p.y &&
                        player.y + player.radius < p.y + p.height + player.dy) {
                        player.dy = JUMP_FORCE;
                        playSound('jump');
                    }
                });
            }

            if (player.y - player.radius > canvas.height) endGame();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--grid-color');
            ctx.beginPath();
            for (let x = 0; x < canvas.width; x += 40) { ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); }
            for (let y = 0; y < canvas.height; y += 40) { ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); }
            ctx.stroke();

            ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--platform-color');
            platforms.forEach(p => ctx.fillRect(p.x, p.y, p.width, p.height));

            ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--player-color');
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(player.x - 5, player.y - 2, 4, 0, Math.PI * 2);
            ctx.arc(player.x + 5, player.y - 2, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'black';
            ctx.beginPath();
            const eyeOffset = player.dx * 0.2;
            ctx.arc(player.x - 5 + eyeOffset, player.y - 2, 1.5, 0, Math.PI * 2);
            ctx.arc(player.x + 5 + eyeOffset, player.y - 2, 1.5, 0, Math.PI * 2);
            ctx.fill();

            scoreHud.textContent = `Score: ${score}`;
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        function startGame() {
            initAudio();
            startOverlay.classList.add('hidden');
            gameOverOverlay.classList.add('hidden');
            gameState = 'PLAYING';
            initGame();
        }

        function endGame() {
            gameState = 'GAMEOVER';
            playSound('gameover');
            finalScoreDisplay.textContent = score;
            gameOverOverlay.classList.remove('hidden');
        }

        loop();
    </script>
</body>

</html>
