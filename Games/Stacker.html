<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stacker</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;700&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background-color: #050510;
            font-family: 'Outfit', sans-serif;
            touch-action: none;
            /* Prevent swipe/drag */
        }

        canvas {
            display: block;
        }

        #ui {
            position: absolute;
            top: 10%;
            width: 100%;
            text-align: center;
            pointer-events: none;
            color: white;
            transition: opacity 0.3s;
        }

        #score {
            font-size: 4rem;
            font-weight: 700;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        #message {
            font-size: 1.5rem;
            opacity: 0.8;
            margin-top: 10px;
        }

        #start-screen,
        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(5, 5, 16, 0.8);
            backdrop-filter: blur(5px);
            z-index: 10;
            transition: opacity 0.5s;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        h1 {
            font-size: 3rem;
            color: #fff;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 15px rgba(0, 255, 255, 0.6);
        }

        p {
            color: #ccc;
            margin-bottom: 2rem;
        }

        button {
            padding: 15px 40px;
            font-size: 1.2rem;
            border: none;
            border-radius: 30px;
            background: linear-gradient(45deg, #00f260, #0575e6);
            color: white;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0, 242, 96, 0.4);
            transition: transform 0.1s;
        }

        button:active {
            transform: scale(0.95);
        }
    </style>
</head>

<body>

    <div id="ui">
        <div id="score">0</div>
    </div>

    <div id="start-screen">
        <h1>STACKER</h1>
        <p>Tap to stack. Align perfectly.</p>
        <button id="start-btn">PLAY</button>
    </div>

    <div id="game-over-screen" class="hidden">
        <h1>GAME OVER</h1>
        <p id="final-score">Score: 0</p>
        <button id="restart-btn">RETRY</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreEl = document.getElementById('final-score');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');

        let width, height;
        let animationId;
        let lastTime = 0;

        // Game Configuration
        const INITIAL_BAR_WIDTH = 250;
        const BAR_HEIGHT = 40;
        const INITIAL_SPEED = 5; // Pixels per frame roughly, but will be time-based
        const SPEED_INCREMENT = 0.2;

        // Game State
        let state = 'MENU'; // MENU, PLAYING, GAMEOVER
        let score = 0;
        let stack = [];
        let currentBar = null;
        let cameraY = 0;
        let targetCameraY = 0;
        let hue = 0;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;

            // Re-render if paused/menu
            if (state !== 'PLAYING') {
                draw();
            }
        }
        window.addEventListener('resize', resize);
        resize();

        class Bar {
            constructor(x, y, w, h, colorHue, moving = false, speed = 0) {
                this.x = x;
                this.y = y;
                this.w = w;
                this.h = h;
                this.colorHue = colorHue;
                this.moving = moving;
                this.speed = speed;
                this.direction = 1; // 1 for right, -1 for left
            }

            update(dt) {
                if (!this.moving) return;

                // Simple harmonic motion or bouncing logic? 
                // Let's use bouncing for classic stacker feel.
                this.x += this.speed * this.direction * (dt / 16); // Normalize to ~60fps

                if (this.x + this.w > width) {
                    this.x = width - this.w;
                    this.direction = -1;
                } else if (this.x < 0) {
                    this.x = 0;
                    this.direction = 1;
                }
            }

            draw(ctx) {
                ctx.fillStyle = `hsl(${this.colorHue}, 80%, 60%)`;
                ctx.shadowColor = `hsl(${this.colorHue}, 80%, 60%)`;
                ctx.shadowBlur = 20;
                ctx.fillRect(this.x, this.y, this.w, this.h);

                // Reset shadow for performance if needed, but looks cool
                ctx.shadowBlur = 0;

                // Top highlight for 3D-ish effect
                ctx.fillStyle = `rgba(255, 255, 255, 0.2)`;
                ctx.fillRect(this.x, this.y, this.w, this.h * 0.2);
            }
        }

        function initGame() {
            score = 0;
            stack = [];
            scoreEl.innerText = score;
            hue = Math.random() * 360;

            // Initial base
            const baseBar = new Bar(
                width / 2 - INITIAL_BAR_WIDTH / 2,
                height - 100,
                INITIAL_BAR_WIDTH,
                BAR_HEIGHT,
                hue,
                false
            );
            stack.push(baseBar);

            spawnNextBar();

            cameraY = 0;
            targetCameraY = 0;
            state = 'PLAYING';

            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');

            if (animationId) cancelAnimationFrame(animationId);
            lastTime = performance.now();
            loop(lastTime);
        }

        function spawnNextBar() {
            const prevBar = stack[stack.length - 1];
            const y = prevBar.y - BAR_HEIGHT;
            hue = (hue + 15) % 360;

            // New bar starts from random side
            let startX = -prevBar.w;
            let dir = 1;
            if (Math.random() > 0.5) {
                startX = width;
                dir = -1;
            }

            const speed = INITIAL_SPEED + (score * SPEED_INCREMENT);

            currentBar = new Bar(
                startX,
                y,
                prevBar.w, // Inherit width
                BAR_HEIGHT,
                hue,
                true,
                speed
            );

            // Override calculated startX with actual bounds for bouncing logic init
            if (dir === 1) currentBar.x = 0;
            else currentBar.x = width - currentBar.w;

            currentBar.direction = dir;
        }

        function placeBar() {
            if (state !== 'PLAYING') return;

            const prevBar = stack[stack.length - 1];

            // Calculate overlap
            const dist = currentBar.x - prevBar.x;
            const overlap = prevBar.w - Math.abs(dist);

            if (overlap > 0) {
                // Success
                score++;
                scoreEl.innerText = score;

                // Crop
                let newX = currentBar.x;
                let newW = overlap;

                if (dist > 0) {
                    // Current is to the right of prev
                    // x is as is, width reduced
                } else {
                    // Current is to the left
                    newX = prevBar.x;
                }

                // Create debris (optional visual polish)
                // createDebris(currentBar.x, currentBar.y, currentBar.w, dist);

                // Update current bar to be static and stacked
                const landedBar = new Bar(
                    newX,
                    currentBar.y,
                    newW,
                    BAR_HEIGHT,
                    currentBar.colorHue,
                    false
                );

                stack.push(landedBar);

                // Move Camera
                if (score > 3) {
                    targetCameraY += BAR_HEIGHT;
                }

                spawnNextBar();

            } else {
                gameOver();
            }
        }

        function gameOver() {
            state = 'GAMEOVER';
            finalScoreEl.innerText = `Score: ${score}`;
            gameOverScreen.classList.remove('hidden');
        }

        function update(dt) {
            if (state !== 'PLAYING') return;

            currentBar.update(dt);

            // Camera smoothing
            cameraY += (targetCameraY - cameraY) * 0.1;
        }

        function draw() {
            // Background
            ctx.fillStyle = '#050510';
            ctx.fillRect(0, 0, width, height);

            ctx.save();
            // Apply camera transform
            ctx.translate(0, cameraY);

            // Draw stack
            stack.forEach(bar => bar.draw(ctx));

            // Draw current
            if (currentBar && state === 'PLAYING') {
                currentBar.draw(ctx);
            }

            ctx.restore();
        }

        function loop(timestamp) {
            if (state !== 'PLAYING' && state !== 'MENU') return; // Allow menu to run if we want animations there

            const dt = timestamp - lastTime;
            lastTime = timestamp;

            update(dt);
            draw();

            animationId = requestAnimationFrame(loop);
        }

        // Input Handling
        function handleInput(e) {
            if (e.target.tagName === 'BUTTON') return; // Let buttons work
            e.preventDefault(); // Stop double firing on some devices

            if (state === 'PLAYING') {
                placeBar();
            }
        }

        window.addEventListener('mousedown', handleInput);
        window.addEventListener('touchstart', handleInput, { passive: false });
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && state === 'PLAYING') {
                placeBar();
            }
        });

        startBtn.addEventListener('click', () => {
            initGame();
        });

        restartBtn.addEventListener('click', () => {
            initGame();
        });

        // Initial Draw
        draw();

    </script>
</body>

</html>
