<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Matrix</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --tile-color: #333;
            --tile-active: #0ff;
            /* Cyan neon */
            --tile-error: #f00;
            --text-color: #eee;
            --gap: 10px;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 20px;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        #level-indicator {
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: #888;
        }

        .game-container {
            position: relative;
            width: 90vmin;
            height: 90vmin;
            max-width: 400px;
            max-height: 400px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: var(--gap);
            width: 100%;
            height: 100%;
        }

        .tile {
            background-color: var(--tile-color);
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.2s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .tile:active {
            transform: scale(0.95);
        }

        .tile.active {
            background-color: var(--tile-active);
            box-shadow: 0 0 15px var(--tile-active);
            transform: scale(1.05);
        }

        .tile.error {
            background-color: var(--tile-error);
            box-shadow: 0 0 15px var(--tile-error);
            animation: shake 0.4s cubic-bezier(.36, .07, .19, .97) both;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 10;
        }

        .overlay.visible {
            visibility: visible;
            opacity: 1;
        }

        .overlay h2 {
            font-size: 2.5rem;
            margin: 0 0 20px;
            color: var(--tile-active);
        }

        .btn {
            background: var(--tile-active);
            color: #000;
            border: none;
            padding: 12px 30px;
            font-size: 1.2rem;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 10px var(--tile-active);
        }

        @keyframes shake {

            10%,
            90% {
                transform: translate3d(-1px, 0, 0);
            }

            20%,
            80% {
                transform: translate3d(2px, 0, 0);
            }

            30%,
            50%,
            70% {
                transform: translate3d(-4px, 0, 0);
            }

            40%,
            60% {
                transform: translate3d(4px, 0, 0);
            }
        }
    </style>
</head>

<body>

    <div id="level-indicator">Level 1</div>

    <div class="game-container">
        <div class="grid" id="grid">
            <!-- Tiles generated by JS -->
        </div>

        <div class="overlay" id="start-overlay">
            <h2>Memory Matrix</h2>
            <button class="btn" onclick="startGame()">Start</button>
        </div>

        <div class="overlay" id="game-over-overlay">
            <h2 style="color: var(--tile-error)">Game Over</h2>
            <p id="final-score" style="margin-bottom: 20px; font-size: 1.2rem;">Level: 1</p>
            <button class="btn" onclick="restartGame()">Try Again</button>
        </div>
    </div>

    <script>
        const grid = document.getElementById('grid');
        const levelDisplay = document.getElementById('level-indicator');
        const startOverlay = document.getElementById('start-overlay');
        const gameOverOverlay = document.getElementById('game-over-overlay');
        const finalScoreDisplay = document.getElementById('final-score');

        let sequence = [];
        let playerSequence = [];
        let level = 1;
        let isInputEnabled = false;

        // Initialize Grid
        for (let i = 0; i < 9; i++) {
            const tile = document.createElement('div');
            tile.classList.add('tile');
            tile.dataset.index = i;
            tile.addEventListener('pointerdown', (e) => handleInput(i, tile)); // Use pointerdown for instant reaction
            grid.appendChild(tile);
        }

        const tiles = document.querySelectorAll('.tile');

        // Show start screen initially
        startOverlay.classList.add('visible');

        function startGame() {
            startOverlay.classList.remove('visible');
            gameOverOverlay.classList.remove('visible');
            resetGameParams();
            setTimeout(playRound, 500);
        }

        function restartGame() {
            gameOverOverlay.classList.remove('visible');
            resetGameParams();
            setTimeout(playRound, 500);
        }

        function resetGameParams() {
            sequence = [];
            playerSequence = [];
            level = 1;
            updateLevelDisplay();
        }

        function updateLevelDisplay() {
            levelDisplay.textContent = `Level ${level}`;
        }

        function playRound() {
            isInputEnabled = false;
            playerSequence = [];

            // Add new random step
            const nextStep = Math.floor(Math.random() * 9);
            sequence.push(nextStep);

            playSequence();
        }

        async function playSequence() {
            // Wait a bit before starting sequence
            await delay(300);

            for (const index of sequence) {
                await flashTile(index);
                await delay(200); // Inter-flash gap
            }

            isInputEnabled = true;
        }

        function flashTile(index) {
            return new Promise(resolve => {
                const tile = tiles[index];
                tile.classList.add('active');
                setTimeout(() => {
                    tile.classList.remove('active');
                    resolve();
                }, 400); // Flash duration
            });
        }

        function handleInput(index, tile) {
            if (!isInputEnabled) return;

            // Visual feedback for tap
            tile.classList.add('active');
            setTimeout(() => tile.classList.remove('active'), 200);

            // Logic check
            const currentStep = playerSequence.length;
            if (sequence[currentStep] === index) {
                playerSequence.push(index);

                // Round complete?
                if (playerSequence.length === sequence.length) {
                    isInputEnabled = false;
                    level++;
                    updateLevelDisplay();
                    setTimeout(playRound, 1000);
                }
            } else {
                // Mistake!
                isInputEnabled = false;
                tile.classList.add('error');
                setTimeout(() => tile.classList.remove('error'), 500);
                triggerGameOver();
            }
        }

        function triggerGameOver() {
            setTimeout(() => {
                finalScoreDisplay.textContent = `You reached Level ${level}`;
                gameOverOverlay.classList.add('visible');
            }, 800);
        }

        function delay(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }
    </script>
</body>

</html>
